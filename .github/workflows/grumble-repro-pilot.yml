name: Grumble repro pilot

on:
  workflow_dispatch:
    inputs:
      problem_statement:
        description: Sanitized Agent SDK issue or failure description (maximum 4000 characters)
        required: true
        type: string
      source_url:
        description: Optional inert public source reference; the workflow does not fetch it
        required: false
        type: string
      command_profile:
        description: The single fixed reproduction command the worker may execute
        required: true
        type: choice
        options:
          - unit
          - check
          - build
          - local-app-server-test

permissions:
  contents: read

jobs:
  reproduce:
    if: github.repository == 'letta-ai/letta-agent-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run offline pilot tests
        run: bun test scripts/grumble-repro-pilot.test.ts

      - name: Type check pilot scripts
        run: >-
          bunx tsc --noEmit --strict --skipLibCheck --target esnext
          --module preserve --moduleResolution bundler
          scripts/grumble-repro-pilot.ts scripts/grumble-repro-pilot.test.ts

      - name: Run Grumble reproduction pilot
        env:
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
          GRUMBLE_REPRO_AGENT_ID: ${{ vars.GRUMBLE_REPRO_AGENT_ID }}
          PILOT_PROBLEM_STATEMENT: ${{ inputs.problem_statement }}
          PILOT_SOURCE_URL: ${{ inputs.source_url }}
          PILOT_COMMAND_PROFILE: ${{ inputs.command_profile }}
        run: bun scripts/grumble-repro-pilot.ts

      - name: Upload reproduction reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grumble-repro-${{ github.run_id }}
          path: ${{ runner.temp }}/grumble-repro-pilot/grumble-repro-report.*
          if-no-files-found: warn
          retention-days: 14

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & Type Check
        run: bun run check

      - name: Unit Tests
        run: bun test

  build:
    needs: check
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify Letta Code peer install
        shell: bash
        run: |
          set -euo pipefail

          package_json="$(npm pack --json)"
          tarball="$(node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(rows[0].filename)' <<<"$package_json")"
          tarball="$(realpath "$tarball")"
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer" "$tarball"' EXIT

          cat > "$consumer/package.json" <<JSON
          {
            "private": true,
            "dependencies": {
              "@letta-ai/letta-agent-sdk": "file:$tarball",
              "@letta-ai/letta-code": "0.34.9"
            }
          }
          JSON

          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund
          CONSUMER="$consumer" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.env.CONSUMER;
          const cli = path.join(root, "node_modules/@letta-ai/letta-code/package.json");
          const nested = path.join(
            root,
            "node_modules/@letta-ai/letta-agent-sdk/node_modules/@letta-ai/letta-code/package.json",
          );
          if (!fs.existsSync(cli)) {
            throw new Error("Letta Code peer was not installed at the consumer root");
          }
          if (fs.existsSync(nested)) {
            throw new Error("Agent SDK reintroduced a nested Letta Code dependency");
          }
          NODE

      - name: SDK smoke test
        # Only run with API key on push or same-repo PRs
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
        run: bun examples/sdk-tour.ts basic

      - name: SDK full test
        # Only run with API key on push or same-repo PRs
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
        run: bun examples/sdk-tour.ts all

      - name: Session model scope integration test
        # Only run with API key on push or same-repo PRs
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
          LETTA_LIVE_INTEGRATION: "1"
        run: bun test src/tests/live.integration.test.ts -t "session model scope"

      - name: Query conversation resume integration test
        # Only run with API key on push or same-repo PRs
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
          LETTA_LIVE_INTEGRATION: "1"
        run: bun test src/tests/live.integration.test.ts -t "query resumes an ordinary conversation with persisted history"

      - name: Cloud transport disconnect integration test
        # Only run with API key on push or same-repo PRs
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
          LETTA_LIVE_INTEGRATION: "1"
        run: bun test src/tests/cloud-transport.live.integration.test.ts

      - name: Shared local App Server integration test
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
          LETTA_LIVE_INTEGRATION: "1"
        run: bun test src/tests/shared-local-app-server.live.test.ts
